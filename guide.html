<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Expedition Guide | 2027</title>

  <!-- Lightweight Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141c2e;
      --border: #23304d;
      --accent: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --teal: #14b8a6;
      --danger: #ef4444;
      --pin-blue: #1e3a8a;
      --pin-border: #3b82f6;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      padding-bottom: 80px;
    }

    /* Sticky Navigation Header */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(20, 28, 46, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.25;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .header-nav-link {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      background: #1f2b45;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .header-nav-link:hover { background: #263555; }
    .header-nav-link.secondary {
      color: var(--teal);
    }

    main { max-width: 680px; margin: 0 auto; padding: 16px; }

    /* Site Selector Bar */
    .site-selector-bar {
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .site-selector-bar::-webkit-scrollbar { display: none; }
    .site-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .site-pill:hover {
      border-color: var(--accent);
      color: #fff;
    }
    .site-pill.active {
      background: rgba(245, 158, 11, 0.16);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Directory Index List (When no ?site= or ?guide= parameter is provided) */
    .directory-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }
    .directory-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
      gap: 12px;
    }
    .directory-card:hover {
      background: #1a243b;
      border-color: var(--accent);
    }
    .dir-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dir-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }
    .dir-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .dir-tag {
      font-family: monospace;
      font-size: 0.72rem;
      color: var(--teal);
      background: rgba(20, 184, 166, 0.12);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .dir-arrow {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }

    /* Top-level Section Header */
    .section-heading {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      margin: 28px 0 12px 0;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-heading:first-of-type { margin-top: 4px; }

    /* Content Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .card-body { padding: 14px; }

    .card-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .meta-time {
      font-size: 0.72rem;
      font-weight: 800;
      color: #fbbf24;
      background: #3b2a0c;
      border: 1px solid #78350f;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .meta-badge {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--teal);
      background: rgba(20, 184, 166, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Card Title with Pin Number Badge */
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pin-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      padding: 0 4px;
      border-radius: 50%;
      background: var(--pin-blue);
      border: 2px solid var(--pin-border);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 800;
      line-height: 1;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    /* Detail / Markdown Content */
    .card-detail {
      font-size: 0.88rem;
      color: #cbd5e1;
      margin-bottom: 12px;
    }
    .card-detail p { margin-bottom: 8px; }
    .card-detail p:last-child { margin-bottom: 0; }
    .card-detail ul, .card-detail ol { margin-left: 20px; margin-bottom: 8px; }
    .card-detail li { margin-bottom: 4px; }
    .card-detail strong { color: #fff; }
    .card-detail blockquote {
      border-left: 3px solid var(--accent);
      background: rgba(245, 158, 11, 0.08);
      padding: 6px 10px;
      border-radius: 0 4px 4px 0;
      margin: 8px 0;
      font-size: 0.82rem;
    }

    /* Card Image Container (Responsive, No Cropping) */
    .card-media {
      width: 100%;
      max-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0;
      border-radius: 8px;
      background: #0b0f19;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .card-media img {
      max-width: 100%;
      max-height: 420px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* Action Buttons (GPS, Website, Speech) */
    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      background: #1f2b45;
      color: var(--accent);
      border: 1px solid var(--border);
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: #263555; }
    .btn.active-speech {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border-color: var(--danger);
    }

    /* Map & Frame Embeds (Responsive 16:9 Aspect Ratio) */
    .embed-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .embed-bar {
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1b263e;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .embed-card iframe {
      display: block;
      width: 100%;
      border: none;
    }
    .embed-card.map iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 320px;
    }
    .embed-card.standard iframe { height: 500px; }
    .embed-footer {
      padding: 8px 12px;
      background: #101625;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

    /* Loading / Error States */
    .state-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header id="page-header">
    <div class="header-left">
      <a id="itinerary-back-btn" class="header-nav-link" href="index.html">← Itinerary</a>
      <h1 id="guide-title">Loading Field Guides...</h1>
    </div>
    <div class="header-actions" id="header-actions"></div>
  </header>

  <main id="content-container">
    <div class="state-msg">Loading data from Google Sheets...</div>
  </main>

  <script>
    // Configured Google Sheets CSV endpoint
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSas-A05UmzHIUQF9XcuRXmx05dFgilJTSuvc2vRL_SgFSQ8KWqsRP5cJlLhSbelbZ3daHlwnn5yalf/pub?gid=0&single=true&output=csv';

    // RFC-compliant CSV parser handling quoted multiline cells
    function parseCSV(text) {
      let p = '', row = [''], ret = [row];
      let i = 0, r = 0, s = true;
      for (let l of text) {
        if ('"' === l) {
          if (s && l === p) row[i] += l;
          s = !s;
        } else if (',' === l && s) {
          row[++i] = '';
        } else if ('\n' === l && s) {
          if ('\r' === p) row[i] = row[i].slice(0, -1);
          row = [''];
          ret[++r] = row;
          i = 0;
        } else {
          row[i] += l;
        }
        p = l;
      }
      return ret;
    }

    // Auto-clean "Not in source", "None", or "N/A"
    function cleanVal(val) {
      if (!val) return '';
      const s = val.trim();
      if (/^(not in source|n\/a|none|null)$/i.test(s)) return '';
      return s;
    }

    // Clean citations and "Not in source" out of Detail markdown
    function cleanDetail(text) {
      if (!text) return '';
      const s = text.trim();
      if (/^(not in source|n\/a|none|null)$/i.test(s)) return '';
      return s
        .replace(/\[\^?\d+(?:[–\-]\d+)?\]/g, '')
        .replace(/\s+\d+(?:[–\-]\d+)?(?=[\.,;]|$)/g, '')
        .trim();
    }

    // Web Speech API text-to-speech handler
    let currentUtterance = null;
    let activeSpeechBtn = null;

    function toggleSpeech(text, btn) {
      if (!('speechSynthesis' in window)) {
        alert('Text-to-speech is not supported on this device/browser.');
        return;
      }

      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        if (activeSpeechBtn) {
          activeSpeechBtn.innerHTML = '🔊 Listen';
          activeSpeechBtn.classList.remove('active-speech');
        }
        if (activeSpeechBtn === btn) {
          activeSpeechBtn = null;
          return;
        }
      }

      const cleanText = text
        .replace(/\[\^?.*?\]/g, '')
        .replace(/[#*_`>~-]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      currentUtterance = new SpeechSynthesisUtterance(cleanText);
      currentUtterance.rate = 0.95;

      currentUtterance.onend = () => {
        btn.innerHTML = '🔊 Listen';
        btn.classList.remove('active-speech');
        activeSpeechBtn = null;
      };

      currentUtterance.onerror = () => {
        btn.innerHTML = '🔊 Listen';
        btn.classList.remove('active-speech');
        activeSpeechBtn = null;
      };

      btn.innerHTML = '⏹ Stop';
      btn.classList.add('active-speech');
      activeSpeechBtn = btn;
      window.speechSynthesis.speak(currentUtterance);
    }

    async function loadGuide() {
      const container = document.getElementById('content-container');
      const headerActions = document.getElementById('header-actions');
      const backBtn = document.getElementById('itinerary-back-btn');
      const params = new URLSearchParams(window.location.search);

      // Support ?site= (primary) and ?guide= (legacy alias)
      const rawSiteParam = params.get('site') || params.get('guide');
      const activeGuideName = rawSiteParam ? rawSiteParam.trim() : '';

      // Configure "← Itinerary" back button with optional ?day= preservation
      const rawDayParam = params.get('day');
      const dayParam = rawDayParam ? rawDayParam.trim() : '';
      backBtn.href = dayParam ? `index.html?day=${encodeURIComponent(dayParam)}` : 'index.html';

      try {
        const response = await fetch(SHEET_CSV_URL);
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        if (rows.length < 2) {
          container.innerHTML = '<div class="state-msg">No data rows found in the sheet.</div>';
          return;
        }

        // Map header row to indices
        const headers = rows[0].map(h => h.trim().toLowerCase());
        const getIdx = (name) => headers.indexOf(name.toLowerCase());

        const idxName = getIdx('name');
        const idxSeq = getIdx('sequence');
        const idxBadge = getIdx('badge');
        const idxTime = getIdx('time');
        const idxTitle = getIdx('title');
        const idxDetail = getIdx('detail');
        const idxImage = getIdx('image');
        const idxMapCoords = getIdx('mapcoords');
        const idxURL = getIdx('url');

        const allRows = rows.slice(1).map(r => ({
          name: cleanVal(r[idxName]),
          sequence: parseFloat(cleanVal(r[idxSeq])) || 9999,
          badge: cleanVal(r[idxBadge]),
          time: cleanVal(r[idxTime]),
          title: cleanVal(r[idxTitle]),
          detail: cleanDetail(r[idxDetail]),
          image: cleanVal(r[idxImage]),
          mapCoords: cleanVal(r[idxMapCoords]),
          url: cleanVal(r[idxURL])
        })).filter(r => r.name);

        // Group all available guides (preserving sheet appearance order)
        const guidesMap = new Map();
        allRows.forEach(row => {
          const key = row.name.toLowerCase();
          if (!guidesMap.has(key)) {
            guidesMap.set(key, {
              name: row.name,
              displayTitle: row.name,
              stopCount: 0
            });
          }
          const entry = guidesMap.get(key);
          if (row.sequence === 10 && row.title) {
            entry.displayTitle = row.title;
          }
          if (row.sequence >= 20) {
            entry.stopCount++;
          }
        });

        const baseUrl = window.location.pathname;
        const daySuffix = dayParam ? `&day=${encodeURIComponent(dayParam)}` : '';

        // =========================================================================
        // DIRECTORY VIEW: If no ?site= (or ?guide=) parameter is provided
        // =========================================================================
        if (!activeGuideName) {
          document.getElementById('guide-title').textContent = 'Field Guides';
          document.title = 'Field Guides Directory | 2027';

          if (guidesMap.size === 0) {
            container.innerHTML = '<div class="state-msg">No guides available in the sheet yet.</div>';
            return;
          }

          let listHtml = '<div class="directory-grid">';

          guidesMap.forEach(g => {
            const guideHref = `${baseUrl}?site=${encodeURIComponent(g.name)}${daySuffix}`;
            const stopsLabel = g.stopCount === 1 ? '1 stop' : `${g.stopCount} stops`;
            listHtml += `
              <a class="directory-card" href="${guideHref}">
                <div class="dir-info">
                  <div class="dir-title">${g.displayTitle}</div>
                  <div class="dir-meta">
                    <span class="dir-tag">${g.name}</span>
                    <span>•</span>
                    <span>${stopsLabel}</span>
                  </div>
                </div>
                <span class="dir-arrow">→</span>
              </a>
            `;
          });

          listHtml += '</div>';
          container.innerHTML = listHtml;
          return;
        }

        // =========================================================================
        // SINGLE GUIDE VIEW: Filter and render the requested ?site=
        // =========================================================================
        const guideRows = allRows
          .filter(r => r.name.toLowerCase() === activeGuideName.toLowerCase())
          .sort((a, b) => a.sequence - b.sequence);

        // Add "All Guides" link on the right of the header (preserving ?day= if present)
        const allGuidesLink = document.createElement('a');
        allGuidesLink.className = 'header-nav-link secondary';
        allGuidesLink.href = dayParam ? `${baseUrl}?day=${encodeURIComponent(dayParam)}` : baseUrl;
        allGuidesLink.textContent = '☰ Guides';
        headerActions.appendChild(allGuidesLink);

        if (guideRows.length === 0) {
          document.getElementById('guide-title').textContent = activeGuideName;
          container.innerHTML = `<div class="state-msg">No entries found matching guide: <strong>${activeGuideName}</strong></div>`;
          return;
        }

        // Extract human-readable Title from Sequence 10 (or fallback to activeGuideName)
        const titleRow = guideRows.find(r => r.sequence === 10);
        const displayTitle = (titleRow && titleRow.title) ? titleRow.title : activeGuideName;
        document.getElementById('guide-title').textContent = displayTitle;
        document.title = `${displayTitle} | 2027`;

        container.innerHTML = '';

        // Render interactive site selector pills at the top of the guide
        if (guidesMap.size > 1) {
          const pillBar = document.createElement('nav');
          pillBar.className = 'site-selector-bar';
          pillBar.setAttribute('aria-label', 'Switch Site Guide');

          guidesMap.forEach(g => {
            const isSelected = g.name.toLowerCase() === activeGuideName.toLowerCase();
            const pill = document.createElement('a');
            pill.className = `site-pill${isSelected ? ' active' : ''}`;
            pill.href = `${baseUrl}?site=${encodeURIComponent(g.name)}${daySuffix}`;
            pill.textContent = g.name;
            pillBar.appendChild(pill);
          });

          container.appendChild(pillBar);

          // Scroll the active pill into view if overflowed
          requestAnimationFrame(() => {
            const activePill = pillBar.querySelector('.site-pill.active');
            if (activePill) {
              activePill.scrollIntoView({ behavior: 'instant', block: 'nearest', inline: 'center' });
            }
          });
        }

        let stopCounter = 0;

        guideRows.forEach(item => {
          // Sequence 10 is the Title row, already rendered in header
          if (item.sequence === 10) {
            return;
          }

          const isDetailEmpty = !item.detail;
          const isImageEmpty = !item.image;
          const isUrlEmpty = !item.url;

          // Rule 1: Section Title
          if (isDetailEmpty && isImageEmpty && isUrlEmpty) {
            const h2 = document.createElement('h2');
            h2.className = 'section-heading';
            h2.textContent = item.title;
            container.appendChild(h2);
            return;
          }

          // Rule 2: Standalone URL Embed
          if (isDetailEmpty && isImageEmpty && !isUrlEmpty) {
            const isMyMap = item.url.includes('google.com/maps/d/');
            const embedDiv = document.createElement('div');
            embedDiv.className = `embed-card ${isMyMap ? 'map' : 'standard'}`;

            let iframeSrc = item.url;
            if (isMyMap) {
              iframeSrc = item.url.replace(/\/edit(\?.*)?$/, '/embed$1').replace(/\/viewer(\?.*)?$/, '/embed$1');
              if (!iframeSrc.includes('/embed')) {
                iframeSrc = iframeSrc.split('?')[0] + '/embed?' + (iframeSrc.split('?')[1] || '');
              }
            }

            embedDiv.innerHTML = `
              <div class="embed-bar">
                <span>${item.title || (isMyMap ? 'Interactive Map' : 'Embedded View')}</span>
                <span style="color:var(--teal)">${isMyMap ? 'Google My Maps' : 'Web View'}</span>
              </div>
              <iframe src="${iframeSrc}" loading="lazy"></iframe>
              ${isMyMap ? `
                <div class="embed-footer">
                  <a class="btn" href="${item.url}" target="_blank">↗ Open in Google Maps</a>
                </div>
              ` : ''}
            `;
            container.appendChild(embedDiv);
            return;
          }

          // Rule 3: Content Card
          const card = document.createElement('article');
          card.className = 'card';

          let html = '<div class="card-body">';

          // Badge & Time Pills
          if (item.badge || item.time) {
            html += '<div class="card-meta">';
            if (item.time) html += `<span class="meta-time">${item.time}</span>`;
            if (item.badge) html += `<span class="meta-badge">${item.badge}</span>`;
            html += '</div>';
          }

          // Matching Circular Pin Badge for stops (Sequence >= 20)
          let pinBadgeHtml = '';
          if (item.sequence >= 20) {
            stopCounter++;
            pinBadgeHtml = `<span class="pin-badge" title="Map Pin ${stopCounter}">${stopCounter}</span>`;
          }

          // Card Title
          if (item.title) {
            html += `<h3 class="card-title">${pinBadgeHtml}<span>${item.title}</span></h3>`;
          }

          // Markdown Detail
          if (item.detail) {
            html += `<div class="card-detail">${marked.parse(item.detail)}</div>`;
          }

          // Image element with graceful removal if file does not exist
          if (item.image) {
            html += `
              <div class="card-media">
                <img src="./images/${item.image}" 
                     alt="${item.title || 'Guide illustration'}" 
                     loading="lazy" 
                     onerror="this.closest('.card-media').remove();">
              </div>
            `;
          }

          // Action Row (Listen, GPS, Website)
          const hasCoords = Boolean(item.mapCoords);
          const hasUrl = Boolean(item.url);
          const hasSpokenContent = Boolean(item.title || item.detail);

          html += '<div class="action-row">';
          
          if (hasSpokenContent) {
            html += `<button type="button" class="btn btn-listen">🔊 Listen</button>`;
          }
          if (hasCoords) {
            html += `<a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.mapCoords)}" target="_blank">📍 Open in Maps</a>`;
          }
          if (hasUrl) {
            html += `<a class="btn" href="${item.url}" target="_blank">🌐 Web Site</a>`;
          }

          html += '</div></div>';
          card.innerHTML = html;

          if (hasSpokenContent) {
            const listenBtn = card.querySelector('.btn-listen');
            const narrationScript = `${item.sequence >= 20 ? 'Stop ' + stopCounter + ': ' : ''}${item.title ? item.title + '. ' : ''}${item.detail || ''}`;
            listenBtn.addEventListener('click', () => toggleSpeech(narrationScript, listenBtn));
          }

          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = `<div class="state-msg" style="color:var(--danger)">Error loading guide: ${err.message}</div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadGuide);
  </script>
</body>
</html>
